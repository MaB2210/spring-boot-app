spring.datasource.url=jdbc:postgresql://localhost:5432/employee_db
spring.datasource.username=postgresUser
spring.datasource.password=postgres1234
spring.datasource.driver-class-name=org.postgresql.Driver

#DELETE THIS PROPERTY from a real App
## we never create/drop/update tables from the JPA/Hibernate side
# in the industry, we already run specific scripts to update/load our tables in DB
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
